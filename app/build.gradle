apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'

android {
    compileSdkVersion 32

    // pghpghpgh changed 20250405
    //buildToolsVersion "32.0.0"
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.share.audiotrackdemo"
        minSdkVersion 21
        targetSdkVersion 32
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            //minifyEnabled false
            // 启用代码混淆、优化和无用代码删除
            minifyEnabled true
            // 启用无用资源删除
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            //minifyEnabled false
            // 启用代码混淆、优化和无用代码删除
            minifyEnabled true
            // 启用无用资源删除
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // pghpghpgh 20250531 Java 8 特性支持
//    compileOptions {
//        sourceCompatibility = JavaVersion.VERSION_1_8
//        targetCompatibility = JavaVersion.VERSION_1_8
//    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.3.2'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
    api 'ng.ngui.ngbase:nguilib:0.0.12'
    implementation 'com.licheedev:android-serialport:2.1.3'

    // pghpghpgh added 20250531
    implementation 'org.yaml:snakeyaml:2.0'

}